# Default values for the harness6-system namespace — Neo4j stack
# (community Helm chart, pinned 5.26.x to match Compose's neo4j:5.26-community;
# slice #46; graphiti-mcp uses raw manifests).
namespace: harness6-system

# Set to your ingress controller's class name to route HTTP endpoints via
# Ingress. graphiti-mcp (8000) can additionally be routed via Ingress when
# this is set; its Service stays NodePort regardless.
#
# NOTE: set this in values-user.yaml (gitignored, generated by bootstrap.sh) —
# it is the last -f overlay deploy.sh passes to Helm and it survives Helm
# upgrades. deploy.sh also falls back to reading it here, but a regeneration
# of values-user.yaml does not overwrite this file, so prefer values-user.yaml.
ingressClassName: ""

# Optional: name of a cluster StorageClass whose reclaimPolicy is Retain
# (spec #42 user story 7 — protect the Graphiti graph from accidental PVC
# deletion). The Neo4j community chart has no reclaimPolicy knob, so the
# default-StorageClass PVC below inherits the class's policy (typically
# Delete). When this is set, deploy.sh provisions the data PVC from THIS
# class instead (chart mode: dynamic). Create the class yourself, e.g.:
#   kubectl apply -f - <<'EOF'
#   apiVersion: storage.k8s.io/v1
#   kind: StorageClass
#   metadata: { name: harness6-retain }
#   provisioner: <your-provisioner>
#   reclaimPolicy: Retain
#   EOF
neo4jStorageClass: ""

# Keep bolt in-cluster (Compose parity: 7687 is not published externally).
services:
  neo4j:
    enabled: false # disables the external LoadBalancer service

neo4j:
  name: neo4j
  edition: community
  # Initial password comes from the harness6-secrets Secret (NEO4J_PASSWORD,
  # created by bootstrap.sh). The chart requires a NEO4J_AUTH key of the form
  # "neo4j/<password>"; deploy.sh derives that wrapper Secret at deploy time
  # (never committed).
  passwordFromSecret: neo4j-auth
  # Modest sizing (spec #42 user story 24). The chart enforces hard minimums
  # of 500m CPU / 2Gi memory, and applies these as BOTH requests and limits —
  # limits-free sizing is not supported by the chart.
  resources:
    cpu: 500m
    memory: 2Gi

# Data PVC on the cluster's default StorageClass (spec #42 user story 8).
# Set neo4jStorageClass above to route it to a Retain-protected class.
# Sizing note (spec #42 story 24): the chart forces requests=limits, so the
# chart's own limits cannot be dropped here — documented deviation.
volumes:
  data:
    mode: defaultStorageClass
    defaultStorageClass:
      accessModes:
        - ReadWriteOnce
      requests:
        storage: 10Gi
