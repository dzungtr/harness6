# Helm values for the SigNoz stack — official SigNoz/charts (slice #44).
# Chart pinned at signoz/signoz 0.129.0 (appVersion v0.129.0 — compose parity).
#
# Deploy (slice #47 wires this up via deploy-signoz.sh):
#   bash deploy-signoz.sh   # repo add charts.signoz.io, install 0.129.0,
#                           # wait, health-gate, report NodePorts
#
# values-user.yaml (generated by bootstrap.sh, slice #43) carries the
# non-secret overrides from infrastructure/.env; secrets come from the
# `harness6-secrets` Secret created at deploy time — never committed here.

# Top-level parameters (slice #43 values-layer contract).
namespace: harness6-system

# Set to your ingress controller's class name (e.g. "nginx") to route the
# SigNoz UI via Ingress. Empty keeps every endpoint on NodePort. OTLP gRPC/HTTP
# always stay NodePort (spec #42, networking decision).
ingressClassName: ""

# Cluster-default StorageClass for all PVCs (spec #42 user story 8).
# Retain note: reclaim policy is a StorageClass/PV property the chart cannot
# set per-release. If your default StorageClass uses Delete, protect the
# volumes by patching PVs to Retain after first deploy, or provide a
# Retain-backed StorageClass. Sizes below keep the volumes recreatable at
# the same capacity.
global:
  storageClass: null

# ---------------------------------------------------------------- ClickHouse
# Chart-managed topology: bundled zookeeper + clickhouse-operator + schema
# migrator + histogramQuantile UDF init container (clickhouse.initContainers.
# udf, enabled by default upstream). No custom XML carried over from Compose.
clickhouse:
  resources:
    requests:
      cpu: "1"
      memory: 2Gi # no hard limits (spec #42 user story 24)
  persistence:
    enabled: true
    size: 50Gi
    storageClass: null
  zookeeper:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
    persistence:
      enabled: true
      size: 5Gi

# --------------------------------------------------------------------- SigNoz
signoz:
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true # internal SQLite — keep persistent (spec #42 storage decision)
    size: 2Gi
    storageClass: null

  service:
    type: NodePort # UI reachable from the workstation (spec #42 user story 15)
    port: 8080
    nodePort: null # auto-assigned; init (#47) reports the actual port
    internalPort: 8085
    opampPort: 4320

  ingress:
    # Flipped on by slice #47 when ingressClassName is set (HTTP endpoints only).
    enabled: false
    className: ""
    hosts:
      - host: signoz.local
        paths:
          - path: /
            pathType: Prefix
            port: 8080

  # env passthrough — verified: templates/signoz/statefulset.yaml renders
  # `include "signoz.env"`, which merges .Values.signoz.env over the chart
  # defaults (keys uppercased; values may be plain strings or valueFrom
  # secretKeyRef maps). Impersonation mode comes from the Compose env set:
  # SIGNOZ_IDENTN_* + SIGNOZ_USER_ROOT_* + JWT secret. Non-secret flags are
  # overridden via values-user.yaml (signozIdentn*/signozUserRootEmail keys,
  # slice #43 contract); secrets reference the deploy-time harness6-secrets.
  env:
    SIGNOZ_JWT_SECRET:
      valueFrom:
        secretKeyRef:
          name: harness6-secrets
          key: SIGNOZ_JWT_SECRET
    SIGNOZ_USER_ROOT_PASSWORD:
      valueFrom:
        secretKeyRef:
          name: harness6-secrets
          key: SIGNOZ_USER_ROOT_PASSWORD

# -------------------------------------------------------------- OTEL Collector
otelCollector:
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
  service:
    type: NodePort # OTLP 4317/4318 reachable from the workstation
  ports:
    otlp: # OTLP gRPC
      enabled: true
      servicePort: 4317
      nodePort: null # auto-assigned; init (#47) reports the actual port
    otlp-http: # OTLP HTTP
      enabled: true
      servicePort: 4318
      nodePort: null
