# graphiti-mcp — raw manifests (spec #42 slice #46). The zepai
# knowledge-graph-mcp standalone image is MCP-only; no upstream chart exists.
# Non-secret configuration is injected via the `graphiti-env` ConfigMap,
# generated by deploy.sh from values-user.yaml; secrets come from the
# `harness6-secrets` Secret (bootstrap.sh). The entity-type schema ConfigMap
# (`graphiti-config`) is generated from the Compose stack's config.yaml.
apiVersion: v1
kind: Service
metadata:
  name: graphiti-mcp
  labels:
    app: graphiti-mcp
spec:
  type: NodePort
  selector:
    app: graphiti-mcp
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30800 # graphiti MCP HTTP endpoint at /mcp/ (and /health)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphiti-mcp
  labels:
    app: graphiti-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: graphiti-mcp
  template:
    metadata:
      labels:
        app: graphiti-mcp
    spec:
      containers:
        - name: graphiti-mcp
          image: zepai/knowledge-graph-mcp:1.0.2-standalone
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: graphiti-env
            - secretRef:
                name: harness6-secrets
          env:
            # Config path for the entity-type schema mounted below.
            - name: CONFIG_PATH
              value: /app/mcp/config/config.yaml
            - name: NEO4J_URI
              value: bolt://neo4j:7687
            - name: NEO4J_USER
              value: neo4j
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: config
              mountPath: /app/mcp/config
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: graphiti-config
